<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064E3B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#fr-bg)"/>
  <!-- Focus concentric pulse rings -->
  <circle cx="16" cy="16" r="10" stroke="#059669" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="7" stroke="url(#ring-grad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="32 10"/>
  <!-- Centered Zen Focus Core -->
  <circle cx="16" cy="16" r="3" fill="#34D399"/>
</svg>
